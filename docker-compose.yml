# Local development database. Run: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stms}
      POSTGRES_DB: ${POSTGRES_DB:-stms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stms} -d ${POSTGRES_DB:-stms}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
